apiVersion: apps/v1
kind: Deployment
metadata:
  name: title-normalizer
spec:
  replicas: 3
  selector:
    matchLabels:
    app: title-normalizer
  template:
    metadata:
      labels:
        app: title-normalizer
    spec:
      containers:
      - name: normalizer
        image: title-normalizer:local
        ports:
        - containerPort: 5001